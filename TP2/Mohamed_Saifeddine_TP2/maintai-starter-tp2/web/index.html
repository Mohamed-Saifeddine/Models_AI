<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MaintAI : client web</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 20px; color: #222; }
  h1 { margin-bottom: 24px; }
  label { display: block; margin-top: 12px; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #aaa; }
  button { margin-top: 18px; padding: 9px 18px; border: 0; background: #2563eb; color: white; cursor: pointer; }
  #result { margin-top: 20px; padding: 12px; border-radius: 4px; }
  .ok { background: #e6f4ea; } .alert { background: #fde7e7; } .err { background: #fff4e5; }
</style>
</head>
<body>
<h1>MaintAI</h1>
<label>URL de l'API <input id="url" value="http://localhost:8000"></label>
<label>Clé API <input id="key" type="password"></label>
<label>Température (°C) <input id="temperature_c" type="number" step="0.1" value="72"></label>
<label>Vibration (mm/s) <input id="vibration_mm_s" type="number" step="0.1" value="6"></label>
<label>Charge (%) <input id="load_pct" type="number" step="1" value="85"></label>
<label>Heures de fonctionnement <input id="runtime_hours" type="number" step="100" value="15000"></label>
<button id="go">Prédire</button>
<div id="result"></div>
<script>
const FEATURES = ["temperature_c", "vibration_mm_s", "load_pct", "runtime_hours"];
const show = (cls, text) => {
  const r = document.getElementById("result");
  r.className = cls;
  r.textContent = text;
};

document.getElementById("go").addEventListener("click", async () => {
  const reading = Object.fromEntries(FEATURES.map(f => [f, Number(document.getElementById(f).value)]));
  const url = document.getElementById("url").value.replace(/\/$/, "");
  const key = document.getElementById("key").value;

  try {
    const response = await fetch(`${url}/v1/predict`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": key,
      },
      body: JSON.stringify(reading),
    });
    const data = await response.json();

    if (!response.ok) {
      const message = data.detail ?? "Erreur inconnue";
      show("err", `Erreur ${response.status} : ${JSON.stringify(message)}`);
      return;
    }

    const probability = (data.failure_probability * 100).toFixed(2);
    const message = `Probabilité de panne : ${probability} % - Alerte : ${data.alert ? "oui" : "non"}`;
    show(data.alert ? "alert" : "ok", message);
  } catch (error) {
    show("err", `API injoignable ou requête bloquée par CORS : ${error.message}`);
  }
});
</script>
</body>
</html>
